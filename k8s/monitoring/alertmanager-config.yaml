apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m

    route:
      receiver: default-webhook
      group_by: [ "alertname", "job" ]
      group_wait: 5s
      group_interval: 10s
      repeat_interval: 1h

    receivers:
      - name: default-webhook
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/ALERTMANAGER_WEBHOOK_URL
            send_resolved: true