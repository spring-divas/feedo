apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-order-db
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: order-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: order-service
      ports:
        - protocol: TCP
          port: 5432

